            --bg-dark: #1a1a1a;
            --bg-card: #252525;
            --text-light: #f8f8f8;
            --text-secondary: #cccccc;

            --modal-overlay: rgba(0, 0, 0, 0.85);
        }

        * {

            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {

            color: var(--text-light);
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(153, 0, 0, 0.1) 0%, transparent 20%),

            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            background: var(--red-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(153, 0, 0, 0.3);
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(153, 0, 0, 0.5)); }
            to { filter: drop-shadow(0 0 15px rgba(153, 0, 0, 0.8)); }
        }

        .header::after {
            content: "";
            display: block;
            width: 150px;
            height: 3px;
            background: var(--red-gradient);
            margin: 15px auto;
            border-radius: 3px;
        }

        .sound-control {
            position: absolute;
            top: 0;
            right: 0;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--red-primary);
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .sound-control:hover {
            background: var(--red-primary);
            color: white;
        }

        .datetime-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .date-box, .time-box {
            background: var(--bg-card);
            padding: 15px 30px;
            border-radius: 12px;
            border: 2px solid rgba(153, 0, 0, 0.3);
            box-shadow: var(--shadow-red), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .date-box::before, .time-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: var(--red-gradient);
        }

        .date-label, .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .date-value {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #cc3333, #ff4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ff4444, #cc3333);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-separator { animation: blink 1s ease-in-out infinite; }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.3; } }

        .wib-badge {
            font-size: 0.9rem;
            padding: 4px 12px;
            background: rgba(153, 0, 0, 0.2);
            border: 1px solid rgba(204, 51, 51, 0.4);
            border-radius: 20px;
            color: var(--red-light);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            padding-left: 45px;
            background: var(--bg-card);
            border: 1px solid rgba(153, 0, 0, 0.3);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
            box-shadow: var(--shadow-red);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px rgba(153, 0, 0, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--red-primary);
        }

        .search-results { margin-top: 10px; color: var(--text-secondary); text-align: center; }

        .ttg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .ttg-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-red);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(153, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .ttg-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--red-gradient);
            z-index: 2;
        }

        .ttg-card:hover { transform: translateY(-8px) scale(1.02); }

            padding: 15px 20px;

            text-align: center;

            align-items: center;
            justify-content: center;
            gap: 8px;

            justify-content: center;

            gap: 4px;

            width: 100%;

            justify-content: space-between;

            padding: 2px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

        .result-label { color: #888; font-weight: normal; font-size: 0.8rem; }

            letter-spacing: 2px;
            padding: 4px 10px;
            border-radius: 4px;

            text-align: center;

            background: #333;

            gap: 10px;
            justify-content: center;

            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;

        .btn-input-result:hover { background: var(--red-light); color: white; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }

        .modal-box {

            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--red-primary);

            width: 90%;
            text-align: center;
            position: relative;
            animation: slideUp 0.3s ease;

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-title {
            font-size: 1.5rem;
            color: var(--red-light);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .modal-body {
            color: var(--text-light);
            margin-bottom: 25px;
            font-size: 1rem;
            line-height: 1.5;

        .btn-modal:hover { transform: scale(1.05); }

            position: fixed;
            top: -10px;
            z-index: 9999;
            color: #fff;
            font-size: 1em;
            pointer-events: none;
            user-select: none;
            animation-name: fall;
            animation-timing-function: linear;
        }
        @keyframes fall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .datetime-container { gap: 15px; flex-direction: column; }

</head>

    // --- AUDIO & SPEECH ENGINE ---
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    }

    function playDing() {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function speakText(text) {
        if (!soundEnabled) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            const voices = window.speechSynthesis.getVoices();
            const googleVoice = voices.find(v => v.name.includes('Google US English'));
            if (googleVoice) utterance.voice = googleVoice;
            window.speechSynthesis.speak(utterance);
        }
    }

    function triggerFullAlert(marketName) {

    // --- CORE FUNCTIONS ---

    function updateDateTime() {
        const now = new Date();
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        
        const dayName = days[now.getDay()];
        const date = now.getDate();
        const month = months[now.getMonth()];
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('dateDisplay').textContent = `${dayName}, ${date} ${month} ${year}`;
        document.getElementById('timeDisplay').innerHTML = `${hours}<span class="time-separator">:</span>${minutes}<span class="time-separator">:</span>${seconds}`;
    }

    function parseTimeToMinutes(timeStr) {
        const [time] = timeStr.split(' ');
        const [hours, minutes] = time.split(':').map(Number);
        return hours * 60 + minutes;
    }

    function isActiveDay(data) {
        if (!data.activeDays) return true;
        const now = new Date();
        return data.activeDays.includes(now.getDay());
    }

    function getNextActiveDay(data) {
        if (!data.activeDays) return null;
        const now = new Date();
        const currentDay = now.getDay();
        const dayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        for (let i = 1; i <= 7; i++) {
            const nextDay = (currentDay + i) % 7;
            if (data.activeDays.includes(nextDay)) return dayNames[nextDay];
        }
        return null;
    }

    function getNextActiveDayDate(data) {
        if (!data.activeDays) return null;
        const now = new Date();
        const currentDay = now.getDay();
        for (let i = 1; i <= 7; i++) {
            const nextDay = (currentDay + i) % 7;
            if (data.activeDays.includes(nextDay)) {
                return { daysToAdd: i, dayOfWeek: nextDay };
            }
        }
        return null;
    }

    function calculateCountdown(tutupTime, bukaTime, data) {
        const now = new Date();
        const currentDay = now.getDay();
        
        if (!isActiveDay(data)) {
            return { isHoliday: true, nextActiveDay: getNextActiveDay(data) };
        }
        
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const tutupMinutes = parseTimeToMinutes(tutupTime);
        const bukaMinutes = parseTimeToMinutes(bukaTime);
        
        let diff;
        let phase;
        
        if (currentMinutes < tutupMinutes) {
            diff = tutupMinutes - currentMinutes;
            phase = 'countdown';
        }
        else if (currentMinutes >= tutupMinutes && currentMinutes < bukaMinutes) {
            return { isBetClose: true, isHoliday: false };
        }
        else {
            const tomorrow = (currentDay + 1) % 7;
            const isTomorrowActive = !data.activeDays || data.activeDays.includes(tomorrow);
            if (isTomorrowActive) {
                diff = (24 * 60) - currentMinutes + tutupMinutes;
            } else {
                const nextActive = getNextActiveDayDate(data);
                if (nextActive) {
                    diff = (nextActive.daysToAdd * 24 * 60) - currentMinutes + tutupMinutes;
                } else {
                    diff = (24 * 60) - currentMinutes + tutupMinutes;
                }
            }
            phase = 'countdown';
        }
        
        const hours = Math.floor(diff / 60);
        const minutes = diff % 60;
        const seconds = 60 - now.getSeconds();
        
        return {
            hours, minutes, seconds: seconds === 60 ? 0 : seconds,
            totalMinutes: diff,
            isHoliday: false, isBetClose: false, phase: phase
        };
    }

    function formatCountdown(countdown) {
        if (countdown.isHoliday) return `LIBUR - Next: ${countdown.nextActiveDay}`;
        if (countdown.isBetClose) return 'BET CLOSE';
        const h = String(countdown.hours).padStart(2, '0');
        const m = String(countdown.minutes).padStart(2, '0');
        const s = String(countdown.seconds).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    function updateCountdowns() {
        document.querySelectorAll('.countdown-timer').forEach((timer, index) => {
            const data = pasaranData[index];
            const countdown = calculateCountdown(data.tutup, data.buka, data);
            timer.textContent = formatCountdown(countdown);
            
            timer.className = 'countdown-timer';
            
            if (alertStates[data.name] === undefined) alertStates[data.name] = false;

            if (countdown.isHoliday) {
                timer.classList.add('holiday');
                alertStates[data.name] = false;
            } else if (countdown.isBetClose) {
                timer.classList.add('phase-betclose');
                if (!alertStates[data.name]) {
                    showAlertModal(data.name);
                    alertStates[data.name] = true;
                }
            } else {
                timer.classList.add('phase-countdown');
                if (countdown.totalMinutes <= 30 && countdown.totalMinutes > 0) {
                    timer.classList.add('warning');
                }
                alertStates[data.name] = false;
            }
        });
    }

        card.innerHTML = `
            <div class="ttg-card__title">
                <span>${data.name}</span>
                <div class="countdown-timer">00:00:00</div>
                <div id="result-${index}" class="${resultClass}">

            <div class="ttg-card__body">
                <div class="ttg-card__row">
                    <span class="ttg-card__label">${iconCalendar} Hari</span>
                    <span class="ttg-card__value">${data.days}</span>

                    <span class="ttg-card__label">${iconClock} Tutup</span>

                <a href="${data.website}" target="_blank" class="btn btn-website">Website</a>
                <button class="btn btn-input-result" onclick="openResultModal('${data.name}', ${index})">Input Result</button>
                ${liveLink}
            </div>
        `;
        return card;
    }
