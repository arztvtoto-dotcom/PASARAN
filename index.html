            --gold-accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {

            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .sidebar {

        }

        .nav-btn {
            width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; margin-bottom: 15px; cursor: pointer; transition: all 0.3s;
            color: var(--text-secondary); font-size:1.2rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--neon-red); color: white; box-shadow: 0 0 15px rgba(255, 23, 68, 0.4);
        }

        .main-container { margin-left: 70px; width: calc(100% - 70px); position: relative; }

        #introOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999;

        }
        #introOverlay.hidden { opacity: 0; pointer-events: none; }

        .intro-logo {
            font-family: var(--font-head); font-size: 3rem; color: var(--neon-red);
            letter-spacing: 5px; margin-bottom: 20px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
        }

            letter-spacing: 2px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }

        .header { text-align: center; padding: 40px 20px 20px; }
        .header h1 {
            font-family: var(--font-head); font-size: 2.8rem; text-transform: uppercase;

            background-clip: text; color: transparent; margin-bottom: 10px; letter-spacing: 2px;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 20px auto 30px; padding: 0 20px; }
        .clock-container {
            background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); padding: 10px 25px;

        }
        .clock-time { font-family: 'Courier New', monospace; font-size: 1.5rem; font-weight: 700; color: var(--text-primary); letter-spacing: 2px; }
        .sound-badge {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255, 23, 68, 0.1);

        }

        .search-wrapper { max-width: 600px; margin: 0 auto 40px; position: relative; padding: 0 20px; }
        .search-input {
            width: 100%; padding: 18px 25px 18px 55px; background: var(--card-bg); border: 1px solid var(--card-border);

        .search-input:focus { border-color: var(--neon-red); background: rgba(255,255,255,0.05); }
        .search-icon { position: absolute; left: 38px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        .ttg-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; max-width: 1400px; margin: 0 auto; padding: 0 20px 60px;
        }

        .ttg-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;

        .market-name { font-family: var(--font-head); font-size: 1.4rem; font-weight: 500; color: var(--text-primary); text-transform: uppercase; }
        
        .timer-box { margin-top: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 5px; display: inline-block; min-width: 140px; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 2px; }
        .timer-display.active { color: var(--neon-red); }
        .timer-display.hourly-active { color: var(--gold-accent); font-family: var(--font-head); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .timer-display.result-mode { color: #fff; background: #b2102f; padding: 5px; border-radius: 4px; border: 1px solid #ff1744; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

        .result-area { padding: 15px 20px; background: rgba(0,0,0,0.2); min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .res-single { font-family: 'Oswald', sans-serif; font-size: 2.2rem; color: var(--gold-accent); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); letter-spacing: 4px; }
        .res-multi { width: 100%; display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; text-align: left; }
        .res-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
        
        .card-body { padding: 15px 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-secondary); }
        .info-val { color: var(--text-primary); font-weight: 500; }
        
        .card-footer { padding: 15px 20px; border-top: 1px solid var(--card-border); display: flex; gap: 10px; }
        
        /* TOMBOL UNIFIKASI (INPUT, WEB, LIVE) */
        .btn { flex: 1; padding: 10px; border-radius: 6px; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; text-align: center; text-transform: uppercase; }

</head>

            {name: "TOTOMACAU MALAM II", days: "Senin s/d Minggu", tutup: "22:00 WIB", buka: "22:15 WIB", website: "https://totomacaunew.us/", live: "https://kick.com/live-ttm4d"},
            {name: "POIPET 22", days: "Senin s/d Minggu", tutup: "22:30 WIB", buka: "22:45 WIB", website: "https://poipetlottery.com/", live: null},
            {name: "HONGKONG", days: "Senin s/d Minggu", tutup: "22:59 WIB", buka: "23:15 WIB", website: "https://hongkongfunlotto.net/", live: "https://kick.com/hongkong-lotto-official", prizeCount: 3},
            {name: "TOTOMACAU MALAM III", days: "Senin s/d Minggu", tutup: "23:00 WIB", buka: "23:15 WIB", website: "https://totomacaunew.us/", live: "https://kick.com/live-ttm4d"},
            {name: "TOTOMALI 2330", days: "Senin s/d Minggu", tutup: "23:15 WIB", buka: "23:30 WIB", website: "https://totomali.com/", live: null},
            {name: "KING KONG4D MALAM", days: "Senin s/d Minggu", tutup: "23:30 WIB", buka: "23:45 WIB", website: "https://kingkongpools.id/", live: "https://kick.com/king-kong-pools"}
        ];

        let pasaranData = [];
        let savedResults = JSON.parse(localStorage.getItem('tvtoto_results')) || {};
        let alertStates = {};
        let soundEnabled = true;
        let audioCtx = null;
        let currentEditingMarket = null;

        /* --- CARA KERJA SCRIPT (EXPLANATION) --- */
        /*
        1.  PENGATURAN DATA (defaultData):
            Script ini punya 'Gudang Data' bawaan (variable defaultData).
            Saat pertama kali dibuka, script menyalin data ini ke LocalStorage (Penyimpanan Browser).
            Jadi data tidak hilang kalau di-refresh.
        
        2.  LOGIKA JAM (calculateTimer):
            Setiap 1 detik, script mengejam jam komputer/laptop Anda (new Date).
            Lalu script bandingkan dengan jam tutup di data pasaran.
            
            - Jika jam Sekarang < Jam Tutup: Maka STATUS OPEN.
            - Jika jam Sekarang >= Jam Tutup AND < Jam Buka: Maka STATUS BET CLOSE.
            - Jika jam Sekarang >= Jam Buka: Hitung mundur ke tutup besok.
        
        3.  KASUS KHUSUS HOKIDRAW:
            Karena HOKIDRAW result per jam, script memakai logika khusus:
            - Jika menit 00 - 04: STATUS BET CLOSE.
            - Jika menit 05 - 59: STATUS OPEN (Hitung mundur ke menit 00 jam berikutnya).
        
        4.  ALARM (triggerAlert):
            Script menyimpan status 'alertStates'.
            Kalau status berubah dari OPEN ke CLOSE, script memanggil fungsi playAlert() (bunyi) dan speakText() (bicara).
            Setelah bunyi sekali, status di-LOCK agar tidak bunyi berulang-ulang saat masih status CLOSE.
        */

        function initData() {
            const stored = localStorage.getItem('tvtoto_config_v3');
            if (stored) pasaranData = JSON.parse(stored);
            else { pasaranData = JSON.parse(JSON.stringify(defaultData)); localStorage.setItem('tvtoto_config_v3', JSON.stringify(pasaranData)); }
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            window.speechSynthesis.getVoices();
        }

        function playAlert() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function speak(text) {
            if (!soundEnabled) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text); u.lang = 'id-ID'; u.rate = 1.1;
            window.speechSynthesis.speak(u);
        }

        function triggerAlert(name) {
            playAlert();
            setTimeout(() => speak(`Perhatian, pasaran ${name} bet close`), 200);
        }

        function parseTime(str) {
            const [t] = str.split(' '); const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function isActiveDay(data) {
            if (!data.activeDays) return true;
            return data.activeDays.includes(new Date().getDay());
        }

        function calculateTimer(data) {
            const now = new Date();
            const curMin = now.getHours() * 60 + now.getMinutes();
            
            // HOKIDRAW LOGIC
            if (data.name === "HOKIDRAW") {
                const m = now.getMinutes();
                const s = now.getSeconds();
                if (m >= 0 && m < 5) return { status: 'CLOSE', text: 'RESULT TIME', isHourly: true };
                else {
                    const nextH = (now.getHours() + 1) % 24;
                    const diff = (nextH * 60) - curMin;
                    return { status: 'ACTIVE', h: Math.floor(diff/60), m: diff%60, s: 60-s, isHourly: true, nextH };
                }
            }

            // NORMAL LOGIC
            if (!isActiveDay(data)) return { status: 'LIBUR' };
            const tutup = parseTime(data.tutup);
            const buka = parseTime(data.buka);
            
            if (curMin < tutup) return { status: 'ACTIVE', h: Math.floor((tutup-curMin)/60), m: (tutup-curMin)%60, s: 60-now.getSeconds() };
            if (curMin >= tutup && curMin < buka) return { status: 'CLOSE' };
            const diff = (24*60) - curMin + tutup;
            return { status: 'ACTIVE', h: Math.floor(diff/60), m: diff%60, s: 60-now.getSeconds() };
        }

        /* --- RENDERING FUNCTIONS --- */
        function renderDashboard() {
            const grid = document.getElementById('jadwal-kartu'); grid.innerHTML = '';
            pasaranData.forEach((d, i) => {
                const res = savedResults[d.name] || (d.prizeCount===3?{p1:'',p2:'',p3:''}:'');
                let resHtml = d.prizeCount===3 
                    ? `<div class="res-multi"><div>P1: <b>${res.p1||'--'}</b></div><div>P2: <b>${res.p2||'--'}</b></div><div>P3: <b>${res.p3||'--'}</b></div></div>`
                    : `<div class="res-single">${res.p1||'----'}</div>`;
                
                const card = document.createElement('div'); card.className = 'ttg-card';
                card.innerHTML = `
                    <div class="card-header"><div class="market-name">${d.name}</div><div class="timer-box"><div class="timer-display" id="timer-${i}">--:--</div></div></div>
                    <div class="result-area">${resHtml}</div>
                    <div class="card-body"><div class="info-row"><span>Hari</span><b>${d.days}</b></div><div class="info-row"><span>Tutup</span><b style="color:var(--neon-red)">${d.tutup}</b></div><div class="info-row"><span>Buka</span><b style="color:#0f0">${d.buka}</b></div></div>
                    <div class="card-footer">
                        <button class="btn btn-input" onclick="openResultModal('${d.name}', ${i})">INPUT</button>
                        <a href="${d.website}" target="_blank" class="btn btn-web">WEB</a>
                        ${d.live ? `<a href="${d.live}" target="_blank" class="btn btn-web">LIVE</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateTimers() {
            const cards = document.querySelectorAll('.ttg-card');
            cards.forEach((c, i) => {
                const d = pasaranData[i];
                const timer = c.querySelector('.timer-display');
                const calc = calculateTimer(d);
                timer.className = 'timer-display';

                if (calc.status === 'LIBUR') timer.textContent = 'LIBUR';
                else if (calc.status === 'CLOSE') {
                    timer.textContent = calc.text || 'BET CLOSE';
                    if (calc.isHourly) timer.classList.add('result-mode');
                    if (!alertStates[d.name]) { triggerAlert(d.name); alertStates[d.name] = true; }
                } else {
                    if (calc.isHourly) { timer.textContent = `CLOSE: ${String(calc.nextH).padStart(2,'0')}:00`; timer.classList.add('hourly-active'); }
                    else { timer.textContent = `${String(calc.h).padStart(2,'0')}:${String(calc.m).padStart(2,'0')}:${String(calc.s).padStart(2,'0')}`; timer.classList.add('active'); }
                    alertStates[d.name] = false;
                }
            });
        }

        function initApp() {
            renderDashboard(); renderSettings();
            setInterval(() => { document.getElementById('timeDisplay').textContent = new Date().toLocaleTimeString('id-ID', {hour12:false}); updateTimers(); }, 1000);
        }

        function enterSite() { initAudio(); initData(); document.getElementById('introOverlay').classList.add('hidden'); initApp(); }

        function renderSettings() {
            const tbody = document.getElementById('settingsTableBody'); tbody.innerHTML = '';
            pasaranData.forEach((d, i) => tbody.innerHTML += `<tr><td><b>${d.name}</b></td><td>${d.tutup}</td><td>${d.buka}</td><td><button class="btn-edit-config" onclick="openConfig(${i})">EDIT</button></td></tr>`);
        }

        function switchView(v, b) {
            document.querySelectorAll('.settings-view').forEach(e=>e.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
            b.classList.add('active');
        }

        function openConfig(i) {
            const d = pasaranData[i];
            document.getElementById('configIndex').value = i;
            document.getElementById('configMarketName').textContent = d.name;
            document.getElementById('cfgName').value = d.name;
            document.getElementById('cfgTutup').value = d.tutup.split(' ')[0];
            document.getElementById('cfgBuka').value = d.buka.split(' ')[0];
            document.getElementById('cfgWeb').value = d.website;
            document.getElementById('cfgLive').value = d.live || '';
            document.getElementById('cfgPrize').value = d.prizeCount || 1;
            document.getElementById('configModal').classList.add('active');
        }

        function saveConfigChanges() {
            const i = document.getElementById('configIndex').value;
            pasaranData[i].name = document.getElementById('cfgName').value;
            pasaranData[i].tutup = document.getElementById('cfgTutup').value + " WIB";
            pasaranData[i].buka = document.getElementById('cfgBuka').value + " WIB";
            pasaranData[i].website = document.getElementById('cfgWeb').value;
            pasaranData[i].live = document.getElementById('cfgLive').value;
            pasaranData[i].prizeCount = parseInt(document.getElementById('cfgPrize').value);
            localStorage.setItem('tvtoto_config_v3', JSON.stringify(pasaranData));
            renderSettings(); renderDashboard(); closeConfigModal();
        }
        function closeConfigModal() { document.getElementById('configModal').classList.remove('active'); }
        function resetConfig() { if(confirm("Reset?")) { localStorage.removeItem('tvtoto_config_v3'); pasaranData = JSON.parse(JSON.stringify(defaultData)); renderSettings(); renderDashboard(); } }

        function openResultModal(n, i) {
            currentEditingMarket = n;
            document.getElementById('resModalMarket').textContent = n;
            const c = document.getElementById('inputContainer'); c.innerHTML = '';
            const d = pasaranData.find(x => x.name === n);
            const saved = savedResults[n] || (d.prizeCount===3?{p1:'',p2:'',p3:''}:{p1:''});
            if (d.prizeCount===3) [1,2,3].forEach(k => c.innerHTML += `<input type="number" id="inp-p${k}" class="modal-input" value="${saved['p'+k]}" placeholder="P${k}">`);
            else c.innerHTML = `<input type="number" id="inp-p1" class="modal-input" value="${saved.p1}" placeholder="Result">`;
            document.getElementById('resultModal').classList.add('active');
        }
        function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); }
        function saveResult() {
            if(!currentEditingMarket) return;
            const d = pasaranData.find(x => x.name === currentEditingMarket);
            const res = { p1: document.getElementById('inp-p1').value, p2: '', p3: '' };
            if(d.prizeCount===3) { res.p2 = document.getElementById('inp-p2').value; res.p3 = document.getElementById('inp-p3').value; }
            savedResults[currentEditingMarket] = res;
            localStorage.setItem('tvtoto_results', JSON.stringify(savedResults));
            renderDashboard(); closeResultModal();
        }

        document.getElementById('soundToggle').onclick = function() {
            soundEnabled = !soundEnabled; this.querySelector('span').textContent = soundEnabled ? 'Sound: ON' : 'Sound: OFF'; this.classList.toggle('active'); if(soundEnabled) initAudio();
        };
        document.getElementById('searchInput').addEventListener('input', (e) => {
            document.querySelectorAll('.ttg-card').forEach(c => c.style.display = c.querySelector('.market-name').textContent.toLowerCase().includes(e.target.value.toLowerCase()) ? 'flex' : 'none');
        });
    </script>
</body>
